<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS视频播放器</title>
    <link href="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video-js.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-hls.js@3.2.0/dist/videojs-contrib-hlsjs.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 960px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
        }
        .video-container {
            position: relative;
            width: 100%;
        }
        .video-js {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 宽高比 */
        }
        .video-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .video-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .video-description {
            color: #666;
            margin-bottom: 10px;
        }
        .video-meta {
            display: flex;
            font-size: 0.875rem;
            color: #777;
        }
        .video-meta-item {
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-container">
            <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" poster="">
                <source src="" type="application/x-mpegURL">
                <p class="vjs-no-js">要查看此视频，请启用JavaScript，并考虑升级到支持HTML5视频的浏览器</p>
            </video>
        </div>
        
        <div class="video-info">
            <div class="video-title" id="videoTitle">视频标题</div>
            <div class="video-description" id="videoDescription">视频描述...</div>
            <div class="video-meta">
                <div class="video-meta-item">时长: <span id="videoDuration">00:00:00</span></div>
                <div class="video-meta-item">大小: <span id="videoSize">0 MB</span></div>
                <div class="video-meta-item">上传时间: <span id="videoUploadTime">2023-01-01</span></div>
            </div>
        </div>
    </div>

    <script>
        // 从URL获取视频ID
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('id');
        
        // 加载视频信息
        if (videoId) {
            fetch(`/video/play/${videoId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200 && data.data) {
                        const videoInfo = data.data;
                        
                        // 设置视频信息
                        document.getElementById('videoTitle').textContent = videoInfo.title;
                        document.getElementById('videoDescription').textContent = videoInfo.description || '无描述';
                        document.getElementById('videoDuration').textContent = videoInfo.formattedDuration;
                        document.getElementById('videoSize').textContent = videoInfo.formattedSize;
                        
                        const createTime = new Date(videoInfo.createTime);
                        document.getElementById('videoUploadTime').textContent = createTime.toLocaleDateString();
                        
                        // 设置视频源和封面
                        const videoPlayer = videojs('videoPlayer');
                        if (videoInfo.coverUrl) {
                            videoPlayer.poster(videoInfo.coverUrl);
                        }
                        
                        if (videoInfo.m3u8Url) {
                            videoPlayer.src({
                                src: videoInfo.m3u8Url,
                                type: 'application/x-mpegURL'
                            });
                        } else if (videoInfo.videoUrl) {
                            // 如果没有m3u8，则使用原始视频
                            videoPlayer.src({
                                src: videoInfo.videoUrl,
                                type: 'video/mp4'
                            });
                        }
                        
                        videoPlayer.load();
                    } else {
                        alert('获取视频信息失败');
                    }
                })
                .catch(error => {
                    console.error('获取视频信息错误:', error);
                    alert('获取视频信息出错');
                });
        } else {
            alert('未指定视频ID');
        }
        
        // 初始化视频播放器
        videojs('videoPlayer', {
            fluid: true,
            responsive: true,
            html5: {
                hlsjsConfig: {
                    debug: false,
                    // 其他hls.js配置
                }
            }
        });
    </script>
</body>
</html>
